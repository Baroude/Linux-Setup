# matugen config for linux-setup wallpaper rotation.
# Invoked by scripts/wallpaper-next.sh after each wallpaper change.
# Run from REPO_DIR so relative input_path values resolve correctly.

[config]
# Always use the dark variant regardless of wallpaper brightness.
mode = "dark"
# tonal_spot: Material 3 palette with primary + secondary + tertiary hues.
scheme_type = "vibrant"

# ── Output templates ──────────────────────────────────────────────────────────

[templates.kde]
input_path  = "templates/kde.colors"
output_path = "~/.local/share/color-schemes/MatugenDynamic.colors"

[templates.kitty]
input_path  = "templates/kitty.conf"
output_path = "~/.config/kitty/theme.conf"

[templates.rofi]
input_path  = "templates/rofi-colors.rasi"
output_path = "~/.config/rofi/colors/matugen.rasi"

[templates.fzf]
input_path  = "templates/fzf-colors.zsh"
output_path = "~/.config/fzf/colors.zsh"

[templates.btop]
input_path  = "templates/btop.theme"
output_path = "~/.config/btop/themes/matugen.theme"

[templates.starship]
input_path  = "templates/starship.toml"
output_path = "~/.config/starship.toml"

[templates.tidal]
input_path  = "templates/tidal-hifi.css"
output_path = "~/.config/tidal-hifi/active.css"

[templates.panel-colorizer]
input_path  = "templates/panel-colorizer.json"
output_path = "~/.config/linux-setup/panel-colorizer-global.json"

[templates.palette]
input_path  = "templates/palette.json"
output_path = "~/.cache/matugen/palette.json"

[templates.nvim]
input_path  = "templates/nvim.vim"
output_path = "~/.config/nvim/colors/matugen.vim"

# qt5ct / qt6ct color palette — for Qt apps that bypass KDE/Kvantum and read qtXct directly.
# Activate once in qt5ct/qt6ct settings: Appearance → Color scheme → matugen.
# After that, apps pick up the new palette on each launch automatically.
[templates.qt5ct]
input_path  = "templates/qtct-colors.conf"
output_path = "~/.config/qt5ct/colors/matugen.conf"

[templates.qt6ct]
input_path  = "templates/qtct-colors.conf"
output_path = "~/.config/qt6ct/colors/matugen.conf"

# Firefox dynamic colors via pywalfox extension + native messaging host.
# Requires: pip install pywalfox && pywalfox install (once), then install the
# Firefox extension. wallpaper-apply.sh runs `pywalfox update` on each change.
[templates.pywalfox]
input_path  = "templates/pywalfox-colors.json"
output_path = "~/.cache/wal/colors.json"

# Kvantum Qt theme — two files required: kvconfig (colors/layout) + svg (shapes).
# kvantum.kvconfig root config must point to theme=matugen (set by setup.sh).
# Qt apps pick up the new theme on next launch.
[templates.kvantum_kvconfig]
input_path  = "templates/kvantum-colors.kvconfig"
output_path = "~/.config/Kvantum/matugen/matugen.kvconfig"

[templates.kvantum_svg]
input_path  = "templates/kvantum-colors.svg"
output_path = "~/.config/Kvantum/matugen/matugen.svg"

# GTK 3 + 4 color overrides — applied on top of the installed base theme (adw-gtk3-dark).
# GTK apps pick up the new colors on next launch; no live-reload needed.
[templates.gtk3]
input_path  = "templates/gtk.css"
output_path = "~/.config/gtk-3.0/gtk.css"

[templates.gtk4]
input_path  = "templates/gtk.css"
output_path = "~/.config/gtk-4.0/gtk.css"

# SDDM needs sudo to install — write to staging path.
# wallpaper-next.sh moves it with `sudo install` via a narrow sudoers rule.
[templates.sddm]
input_path  = "templates/sddm-theme.conf"
output_path = "~/.cache/matugen/sddm-theme.conf"
