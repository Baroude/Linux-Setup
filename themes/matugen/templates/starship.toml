# ~/.config/starship.toml
# Generated by matugen — do not edit manually.
# Re-generated by scripts/wallpaper-next.sh on each wallpaper rotation.
#
# Segments: os  directory  git  languages  docker  cmd_duration    time (right)
# No backgrounds, no powerline. Colored symbols + text only.

"$schema" = 'https://starship.rs/config-schema.json'

palette = 'matugen'

format = """
$os$directory$git_branch$git_status\
$c$rust$golang$nodejs$php$java$kotlin$haskell$python\
$docker_context$cmd_duration
$character"""

right_format = '$time'

# --- OS icon ---
[os]
disabled = false
format   = '[$symbol](fg:red)'

[os.symbols]
Linux   = "󰌽 "
Debian  = "󰣚 "
Ubuntu  = "󰕈 "
Windows = " "
Macos   = "󰀵 "
Arch    = "󰣇 "
Fedora  = "󰣛 "
Manjaro = " "

# --- Username (SSH / root only) ---
[username]
show_always = false
style_user  = "fg:subtext0"
style_root  = "fg:red bold"
format      = '[$user ](style)'

# --- Directory ---
[directory]
style             = "fg:peach bold"
format            = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music"     = "󰝚 "
"Pictures"  = " "

# --- Git ---
[git_branch]
symbol = " "
format = '[$symbol$branch ](fg:yellow)'

[git_status]
format     = '([$all_status$ahead_behind ](fg:yellow))'
up_to_date = ''
modified   = '~${count}'
staged     = '+${count}'
untracked  = '?${count}'
deleted    = '✘${count}'
renamed    = '»${count}'
stashed    = '≡'
ahead      = '⇡${count}'
behind     = '⇣${count}'
diverged   = '⇕⇡${ahead_count}⇣${behind_count}'
conflicted = '⚡${count}'

# --- Languages (only shown when in a matching project) ---
[c]
symbol = " "
format = '[$symbol$version ](fg:green)'

[rust]
symbol = " "
format = '[$symbol$version ](fg:green)'

[golang]
symbol = " "
format = '[$symbol$version ](fg:green)'

[nodejs]
symbol = " "
format = '[$symbol$version ](fg:green)'

[php]
symbol = " "
format = '[$symbol$version ](fg:green)'

[java]
symbol = " "
format = '[$symbol$version ](fg:green)'

[kotlin]
symbol = " "
format = '[$symbol$version ](fg:green)'

[haskell]
symbol = " "
format = '[$symbol$version ](fg:green)'

[python]
symbol = " "
format = '[$symbol$version ](fg:green)'

# --- Docker ---
[docker_context]
symbol = " "
format = '[$symbol$context ](fg:sapphire)'

# --- Command duration (inline, subtle) ---
[cmd_duration]
disabled          = false
min_time          = 2000
show_milliseconds = false
format            = '[took $duration ](fg:overlay1)'

# --- Time (right-aligned) ---
[time]
disabled    = false
time_format = "%R"
format      = '[  $time](fg:lavender)'

# --- Prompt character ---
[character]
disabled                  = false
success_symbol            = '[❯](bold fg:green)'
error_symbol              = '[❯](bold fg:red)'
vimcmd_symbol             = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol     = '[❮](bold fg:lavender)'
vimcmd_visual_symbol      = '[❮](bold fg:yellow)'

# --- Matugen dynamic palette ---
# Color names match the Catppuccin slot names used in format strings above,
# mapped to the nearest M3 semantic role so segment colors stay consistent.
[palettes.matugen]
rosewater = '{{ colors.primary.dark.hex }}'
flamingo  = '{{ colors.primary_container.dark.hex }}'
pink      = '{{ colors.secondary.dark.hex }}'
mauve     = '{{ colors.primary.dark.hex }}'
red       = '{{ colors.error.dark.hex }}'
maroon    = '{{ colors.error_container.dark.hex }}'
peach     = '{{ colors.tertiary.dark.hex }}'
yellow    = '{{ colors.secondary.dark.hex }}'
green     = '{{ colors.tertiary.dark.hex }}'
teal      = '{{ colors.tertiary_container.dark.hex }}'
sky       = '{{ colors.secondary_container.dark.hex }}'
sapphire  = '{{ colors.secondary.dark.hex }}'
blue      = '{{ colors.primary.dark.hex }}'
lavender  = '{{ colors.primary_container.dark.hex }}'
text      = '{{ colors.on_background.dark.hex }}'
subtext1  = '{{ colors.on_surface.dark.hex }}'
subtext0  = '{{ colors.on_surface_variant.dark.hex }}'
overlay2  = '{{ colors.outline.dark.hex }}'
overlay1  = '{{ colors.outline_variant.dark.hex }}'
overlay0  = '{{ colors.surface_variant.dark.hex }}'
surface2  = '{{ colors.surface_variant.dark.hex }}'
surface1  = '{{ colors.surface.dark.hex }}'
surface0  = '{{ colors.surface.dark.hex }}'
base      = '{{ colors.background.dark.hex }}'
mantle    = '{{ colors.background.dark.hex }}'
crust     = '{{ colors.background.dark.hex }}'
